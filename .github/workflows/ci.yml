name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verion
          POSTGRES_PASSWORD: verion
          POSTGRES_DB: verion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://verion:verion@localhost:5432/verion
      REDIS_URL: redis://localhost:6379/0
    # Every third-party action is pinned to a full commit SHA with the tag it
    # resolved to in a trailing comment, and advanced deliberately — a tag is a
    # mutable pointer, a SHA is not. This is the house style for all of them, not
    # a special case for setup-trivy (which was the only one until M5.0). Two
    # reasons it is settled once rather than per action: astral-sh/setup-uv
    # publishes no floating major tag above v7, so it *must* be pinned exactly
    # anyway; and one file with two conventions has no rule saying which applies
    # to the next action added. Verify each target against the action's own
    # repository before bumping (ADR-0009) — including the runtime, which is read
    # from `runs.using` in that tag's action.yml and not from the release notes.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        # The Python version comes from .python-version (3.12), which uv reads
        # directly — pyproject's requires-python, ruff target-version and mypy
        # python_version all already agree with it.
        #
        # Do NOT add a `python-version:` input here. On v10 it *is* a real input
        # (it was added in v4; on the v3 pinned here until M5.0 it was silently
        # ignored, which is what the previous version of this comment said). So
        # the reason not to pass it has changed and got stronger: it would make a
        # second source of truth that can disagree with .python-version, rather
        # than doing nothing. One was passed here from M0.2 until 2026-08-21.
        #
        # Two more v10 defaults this step depends on, recorded so a future bump
        # can tell what was deliberate: `activate-environment` is false, so every
        # step below still goes through `uv run`; and `enable-cache` is set
        # explicitly here, so v10's "disable automatic caching for sensitive
        # events" — which only applies to the default `auto` — does not. v9 also
        # flipped `prune-cache` to false, so the uv cache uploads unpruned.
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy --strict, src/ only — ADR-015)
        run: uv run mypy

      - name: Architecture boundaries (import-linter)
        run: uv run lint-imports

      # Re-derives documentation claims from the artifacts that make them true
      # (this file, CLAUDE.md's Tier 1 table, the agent definitions) rather than
      # trusting a second copy of the description. See the script's docstring.
      - name: Documentation claims (check_claims)
        run: uv run python scripts/check_claims.py

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Install Trivy
        # Trivy is a Go binary, not pip-installable (unlike Semgrep, whose
        # PyPI wheel bundles the compiled binary) — this is a genuinely new
        # class of CI dependency. 81e51434... is aquasecurity/setup-trivy's
        # v0.3.1 tag, still the newest release at M5.0 (v0.3.0 is broken
        # upstream, do not use). The SHA pin is the convention described at the
        # top of `steps:` — this step is where it started, not an exception to it.
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Compute daily cache key
        id: trivy-cache-date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-cache-date.outputs.date }}
          restore-keys: trivy-db-

      - name: Warm Trivy vulnerability DB cache
        # Trivy refuses --skip-db-update on a genuinely empty cache ("cannot
        # be specified on the first run") — verified directly. TrivyAdapter's
        # integration tests always pass skip_db_update=True (see ADR-0012),
        # so the cache must already be populated before pytest runs; this
        # step is a no-op download once actions/cache has a same-day hit.
        run: trivy fs --download-db-only

      - name: Pull ZAP Docker image
        # Warms the image before ZapAdapter's integration test runs, so that
        # test's own timeout isn't dominated by a cold pull. Docker itself
        # needs no setup step — it's preinstalled on ubuntu-latest. Pinned
        # to the digest ZapAdapter's docker_image default uses (see that
        # file's comment for when/how it was verified), not the floating
        # :stable tag, per ADR-0009.
        run: >-
          docker pull ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef

      # Named for what it runs: testpaths = ["tests"] means this has always
      # executed integration tests too, despite the old "Unit tests" label.
      # This step's duration is the tracked full-suite runtime baseline in
      # CLAUDE.md's testing requirements.
      - name: Tests (pytest — unit + integration)
        run: uv run pytest

      - name: Build
        run: uv build
