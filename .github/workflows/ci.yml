name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verion
          POSTGRES_PASSWORD: verion
          POSTGRES_DB: verion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://verion:verion@localhost:5432/verion
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Architecture boundaries (import-linter)
        run: uv run lint-imports

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Install Trivy
        # Trivy is a Go binary, not pip-installable (unlike Semgrep, whose
        # PyPI wheel bundles the compiled binary) — this is a genuinely new
        # class of CI dependency. Pinned to a commit SHA (not just the tag)
        # per this repo's dependency-verification standard (ADR-0009):
        # 81e51434... is aquasecurity/setup-trivy's v0.3.1 tag, the current
        # release as of writing (v0.3.0 is broken upstream, do not use).
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Compute daily cache key
        id: trivy-cache-date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-cache-date.outputs.date }}
          restore-keys: trivy-db-

      - name: Warm Trivy vulnerability DB cache
        # Trivy refuses --skip-db-update on a genuinely empty cache ("cannot
        # be specified on the first run") — verified directly. TrivyAdapter's
        # integration tests always pass skip_db_update=True (see ADR-0012),
        # so the cache must already be populated before pytest runs; this
        # step is a no-op download once actions/cache has a same-day hit.
        run: trivy fs --download-db-only

      - name: Unit tests (pytest)
        run: uv run pytest

      - name: Build
        run: uv build
