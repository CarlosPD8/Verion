[project]
name = "verion"
version = "0.1.0"
description = "From security findings to security decisions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    # arq: the only async-native Redis job queue (Celery/RQ are sync-first,
    # fighting rule 7's async-by-default principle). Verified per ADR-009
    # against primary sources, not memory: as of this writing it is in
    # "maintenance only mode" (github.com/python-arq/arq issue #510,
    # maintainer Samuel Colvin, 2025-10-18) — security fixes continue and
    # the repo stays open to community PRs, but no active new-feature work.
    # Not abandoned (0.28.0 shipped 2026-04-16, after the announcement).
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    # PyYAML: serializes ZapAdapter's Automation Framework plan file. Verified
    # per ADR-009 against primary sources, not memory: org-owned repo
    # (github.com/yaml/pyyaml), current release 6.0.3, actively maintained —
    # no abandonment signal. Used instead of hand-built YAML strings so a
    # target URL containing YAML-special characters can never corrupt the
    # plan document's structure.
    "pyyaml>=6.0.3",
    # semgrep: SAST engine per PRODUCT_SPEC's tech stack. Verified per ADR-009
    # against primary sources, not memory: published to PyPI by Semgrep Inc.
    # (San Francisco security company, formerly r2c), actively maintained,
    # releases as recent as 2026-07 (v1.170.0) — no abandonment signal. The
    # PyPI wheel bundles the compiled binary, so `uv sync --locked` alone
    # makes the `semgrep` CLI available — no extra CI install step needed.
    "semgrep>=1.170.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "import-linter>=2.13",
    # mypy: the CI type-checking gate (ADR-015). Verified per ADR-009 against
    # primary sources, not memory: org-owned repo (github.com/python/mypy),
    # MIT, current release 2.3.1, maintained by a team rather than a single
    # person — no abandonment signal. Chosen over pyright specifically because
    # it is pure-Python and arrives via `uv sync` alone; pyright needs either a
    # node toolchain in CI or a PyPI wrapper that downloads a node binary at
    # runtime, which is exactly the supply-chain surface ADR-009 exists to
    # scrutinize.
    "mypy>=2.3.1",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
    # types-PyYAML: stubs for the pyyaml runtime dependency, needed for
    # ZapAdapter's plan serialization to type-check. Verified per ADR-009
    # against primary sources, not memory: org-owned repo
    # (github.com/python/typeshed, stubs/PyYAML), Apache-2.0, released
    # 2026-08-15 — actively maintained alongside PyYAML itself.
    "types-PyYAML>=6.0.12.20260815",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# Still reported, still fails CI — never auto-rewritten (G8). Every code below
# rewrites the *structure* of an expression, or relocates an import. In a test
# whose subject IS that structure — operand order, argument order, an import held
# back on purpose — a semantics-preserving rewrite is still a coverage-destroying
# one, and the weakened test goes green with nothing objecting. SIM300 already did
# exactly this to test_severity.py once, collapsing four assertions into two.
#
# Deliberately not `per-file-ignores`: that would stop these rules firing at all,
# in CI as well as in the hook, trading a silent-rewrite risk for a silent-
# detection loss. `unfixable` removes only the rewriting.
#
# This list is not the whole of G8. A future rule that rewrites expression
# structure and never gets added here is the same failure — see the register.
#
# Derive it, do not eyeball it. The first version of this list was built from an
# enumeration that silently dropped every C4 rule (the filter stripped trailing
# digits, so "C400" became "C" and never matched the "C4" selector) and counted
# preview rules that cannot fire. `ruff check --show-settings` reports the
# enabled set from the resolved config and is the source to use.
unfixable = [
    # Comparison and boolean-expression rewrites.
    "SIM300",                               # yoda-conditions
    "SIM201", "SIM202",                     # negate-(not-)equal-op
    "SIM220", "SIM221", "SIM222", "SIM223", # boolean-expression collapse
    "E711", "E712", "E713", "E714",         # None/True/in/is comparison rewrites
    # Import relocation — fix is new in 0.16.3.
    "E402",
    # The whole autofixable flake8-comprehensions family. Every one rewrites a
    # call into a comprehension or literal or back again (C417 turns
    # `map(f, xs)` into a comprehension; C416 removes one entirely), which is
    # the written criterion above, so they are in. C415 is enabled but carries
    # no fix, so listing it would be noise.
    "C400", "C401", "C402", "C403", "C404", "C405", "C406", "C408", "C409",
    "C410", "C411", "C413", "C414", "C416", "C417", "C418", "C419", "C420",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# Scoped to src/ deliberately (ADR-015). src/ was already ~100% annotated when
# the gate was introduced, so --strict cost 5 errors more than default mode and
# there is no annotation backlog to pay down. tests/ is the opposite: hundreds
# of unannotated helpers, plus a duplicate `conftest` module name that halts
# mypy before it checks anything. Widening scope to tests/ is a deliberate
# future decision, not an oversight.
python_version = "3.12"
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# --durations=10 keeps the slowest tests visible in every CI log. The suite's
# runtime is driven by a handful of container-bound tests, not by test count
# (ZapAdapter's two take 31-34s of a ~58s local run), so the number that
# matters is which tests are slow, not how many there are. Until this landed
# there was no per-test breakdown of a CI run at all. See CLAUDE.md's testing
# requirements for the tracked baseline and its thresholds.
addopts = ["--durations=10"]
asyncio_mode = "auto"
# Session-scoped: a session-scoped async engine (see tests/integration/conftest.py)
# needs a session-scoped event loop, or asyncpg connections created in one test's
# loop get reused in another's and fail with "InterfaceError: another operation
# is in progress". Don't remove these two settings — see CLAUDE.md's testing
# requirements section.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.importlinter]
root_package = "verion"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers-identity"
name = "identity: adapters -> application -> ports -> domain"
type = "layers"
layers = [
    "adapters",
    "application",
    "ports",
    "domain",
]
containers = ["verion.modules.identity"]

