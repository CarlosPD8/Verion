[project]
name = "verion"
version = "0.1.0"
description = "From security findings to security decisions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "import-linter>=2.13",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "verion"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers-identity"
name = "identity: adapters -> application -> ports -> domain"
type = "layers"
layers = [
    "adapters",
    "application",
    "ports",
    "domain",
]
containers = ["verion.modules.identity"]

[[tool.importlinter.contracts]]
id = "layers-projects"
name = "projects: adapters -> application -> ports -> domain"
type = "layers"
layers = [
    "adapters",
