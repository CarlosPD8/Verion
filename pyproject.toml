[[tool.importlinter.contracts]]
id = "cross-module-identity"
name = "identity does not reach into other modules' domain/adapters directly"
type = "forbidden"
source_modules = ["verion.modules.identity"]
forbidden_modules = [
    "verion.modules.projects.domain",
    "verion.modules.projects.adapters",
    "verion.modules.scanning.domain",
    "verion.modules.scanning.adapters",
    "verion.modules.normalization.domain",
